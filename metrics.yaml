metrics:
  net_revenue:
    description: "Actual realized revenue after coupons and discounts for fulfilled orders"
    formula: "SUM(o.order_value - COALESCE(o.discount_amount, 0))"
    table: "zomato_orders o"
    default_filter: "o.order_status = 'delivered' AND o.payment_status = 'completed'"

  gross_merchandise_value:
    description: "Total order value before discounts"
    formula: "SUM(o.order_value)"
    table: "zomato_orders o"

  active_customers:
    description: "Customers who have placed at least one delivered order"
    condition: "customer_id IN (SELECT DISTINCT customer_id FROM zomato_orders WHERE order_status = 'delivered')"

synonyms:
  prime_users: "is_prime = true"
  cancelled: "order_status IN ('cancelled', 'failed')"
  successful_orders: "order_status = 'delivered'"
